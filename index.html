<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>팀 기록</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1c2733;--muted:#5b6570;--line:#dfe4ea;--accent:#1f3a5f;--accent-soft:#e9eef5;--ok:#1d7a4f;--bad:#b3261e;--note:#7a5200;--note-bg:#fff6e0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  header{background:var(--accent);color:#fff;padding:18px 16px 14px}
  header .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .wrap,main{max-width:860px;margin:0 auto}
  header h1{margin:0;font-size:22px;letter-spacing:-.2px}
  header p{margin:2px 0 0;font-size:13px;opacity:.85}
  header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  nav button{border:0;background:none;padding:13px 13px;font:inherit;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
  nav button[aria-selected="true"]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
  nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d9822b;margin-left:5px;vertical-align:middle}
  main{padding:16px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
  .note{background:var(--note-bg);color:var(--note);border:1px solid #f0dfb0;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
  label small{font-weight:400;color:var(--muted)}
  textarea,input[type=text],input[type=password],input[type=date],input[type=time],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:62px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:11px 18px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{font-size:14px;color:var(--ok)}
  .msg.bad{color:var(--bad)}
  .people{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
  .person{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:#fff}
  .person b{display:block;font-size:15px}
  .person .done{color:var(--ok)}
  .person .todo{color:var(--muted)}
  .entry{border-top:1px solid var(--line);padding:12px 0}
  .entry:first-of-type{border-top:0;padding-top:4px}
  .entry .who{font-weight:700}
  .entry .meta{color:var(--muted);font-size:13px;margin-left:6px}
  .entry dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
  .entry dt{color:var(--muted);white-space:nowrap}
  .entry dd{margin:0;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--muted);font-size:15px;padding:6px 0}
  .soon li{margin:5px 0}
  .lock{display:inline-block;background:#eceff3;color:var(--muted);border-radius:999px;font-size:12px;padding:1px 8px;margin-left:6px}
  iframe.cal{width:100%;height:600px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .narrow{max-width:400px;margin:6vh auto 0}
  .seg{display:flex;gap:6px;margin-bottom:6px}
  .seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;font:inherit;cursor:pointer;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
  main.wide{max-width:1180px}
  .btn.ghost{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .btn.small{padding:8px 13px;font-size:14px}
  .cols{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px;align-items:start}
  .col{background:#e9edf2;border-radius:12px;padding:8px}
  .col h3{margin:3px 5px 9px;font-size:14px;display:flex;justify-content:space-between}
  .col h3 span{color:var(--muted);font-weight:400}
  .col .empty{font-size:13px;padding:2px 5px 6px}
  .tile{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
  .tile:last-child{margin-bottom:0}
  .tile:hover,.tile:focus-visible{border-color:var(--accent);outline:0}
  .tile b{display:block;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .chip{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .chip.plain{background:#eceff3;color:var(--muted)}
  .chip.late,.chip.clash{background:#fde8e6;color:var(--bad)}
  .chip.wait{background:var(--note-bg);color:var(--note)}
  .chip.clash{font-weight:700}
  .only-narrow{display:none}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
  dialog{border:0;border-radius:14px;padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);color:var(--ink);background:#fff}
  dialog::backdrop{background:rgba(20,30,45,.45)}
  dialog form{padding:18px}
  dialog h2{margin:0 0 4px;font-size:18px}
  .log{margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
  .log li{padding:3px 0;border-top:1px solid var(--line)}
  .checks{list-style:none;margin:6px 0 0;padding:0}
  .checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
  .checks li:first-child{border-top:0}
  .checks input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
  .checks .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .checks .done .t{color:var(--muted);text-decoration:line-through}
  .checks .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
  .addrow{display:grid;grid-template-columns:1fr 130px 150px auto;gap:8px;margin-top:10px}
  .day{margin-top:12px}
  .day h3{font-size:14px;margin:0 0 4px;color:var(--accent)}
  .day h3.today{color:var(--bad)}
  .ev{display:flex;gap:10px;padding:5px 0;font-size:15px}
  .ev .when{color:var(--muted);width:92px;flex:none;font-size:14px}
  @media (max-width:760px){.addrow{grid-template-columns:1fr 1fr}}
  @media (max-width:760px){.cols{grid-template-columns:1fr}.col{display:none}.col.active{display:block}.only-narrow{display:flex}.grid3{grid-template-columns:1fr}}
  @media (max-width:520px){.entry dl{grid-template-columns:1fr}.entry dt{margin-top:6px}}
</style>
</head>
<body>
<header><div class="wrap"><div><h1 id="title">팀 기록</h1><p id="today"></p></div><button id="logout" type="button" hidden>나가기</button></div></header>
<nav hidden><div class="wrap" id="tabs" role="tablist"></div></nav>
<main id="view"></main>
<script>
(function () {
  "use strict";
  var API = "https://hcsoctvuzjwgvxfcrwtb.supabase.co/functions/v1/portal";
  // 주소의 맨 앞 이름으로 프로젝트를 고른다(orderless.…, team1.…). 미리보기에서는 ?p=team1.
  // admin은 분석 화면을 여는 사람을 부르는 말. 학교 프로젝트에서는 "대표"라고 하지 않는다.
  var PROJECTS = { orderless: { key: "orderless", name: "오더리스", admin: "대표" }, team1: { key: "team1", name: "남뀨", admin: "관리자" } };
  var sub = location.hostname.split(".")[0];
  var project = PROJECTS[sub] || PROJECTS[new URLSearchParams(location.search).get("p")] || PROJECTS.orderless;

  var DAILY = [
    { key: "did", label: "오늘 한 일", required: true },
    { key: "why", label: "목적", hint: "왜 했는지" },
    { key: "good", label: "잘된 것" },
    { key: "regret", label: "아쉬운 것" },
    { key: "next", label: "내일 할 일", required: true }
  ];
  var WEEKLY = [
    { key: "did", label: "이번 주 한 일", required: true },
    { key: "good", label: "잘된 것" },
    { key: "regret", label: "아쉬운 것" },
    { key: "next", label: "다음 주 할 일" }
  ];
  var ERRORS = {
    WRONG_PASSCODE: "비밀번호가 맞지 않습니다.", WRONG_PASSWORD: "이름이나 비밀번호가 맞지 않습니다.", WRONG_SITE: "이 주소에서는 들어갈 수 없는 프로젝트입니다.",
    LOCKED: "여러 번 틀려서 잠겼습니다. 15분 뒤에 다시 해 주세요.", REQUIRED: "필수 칸을 적어 주세요.", NAME_REQUIRED: "이름을 적어 주세요.",
    NAME_TAKEN: "이미 가입된 이름입니다. '이미 가입했어요'에서 들어와 주세요.", TOO_SHORT: "비밀번호는 6자 이상으로 정해 주세요.", TOO_SHORT_ADMIN: "8자 이상으로 정해 주세요.",
    ALREADY_SET: "이미 정해져 있습니다.", GITHUB_NOT_READY: "GitHub 연결이 아직 준비되지 않았습니다.", PULL_FIRST: "먼저 '가져오기'를 눌러 주세요.",
    GITHUB_FAILED: "GitHub와 연결하지 못했습니다. 잠시 뒤에 다시 해 주세요.", BAD_OPTION: "보드에 없는 선택지입니다. '가져오기'를 한 뒤 다시 골라 주세요.",
    BAD_DATE: "마감 날짜를 다시 골라 주세요.", TOO_SHORT_KEY: "연결 키가 너무 짧습니다.", ADMIN_ONLY: "관리 권한이 필요합니다.", NOT_FOUND: "카드를 찾지 못했습니다. '가져오기'를 눌러 주세요.", NETWORK: "연결하지 못했습니다. 잠시 뒤에 다시 해 주세요."
  };
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  var local = {
    get: function (k) { try { return localStorage.getItem("teamlog:" + project.key + ":" + k); } catch (e) { return null; } },
    set: function (k, v) { try { v === null ? localStorage.removeItem("teamlog:" + project.key + ":" + k) : localStorage.setItem("teamlog:" + project.key + ":" + k, v); } catch (e) {} }
  };
  var state = { token: local.get("token"), data: null, tab: "today" };

  function call(action, body) {
    var payload = Object.assign({ action: action, token: state.token }, body || {});
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw { code: j.error || "SERVER" }; return j; }); }, function () { throw { code: "NETWORK" }; });
  }
  function say(e) { return ERRORS[e && e.code] || "문제가 생겼습니다. 다시 해 주세요."; }
  function expired(e) { return e && (e.code === "NO_SESSION" || e.code === "NO_MEMBER"); }
  function keep(d) { if (d.token) { state.token = d.token; local.set("token", d.token); } state.data = d; }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (a) {
      if (a === "text") n.textContent = attrs[a];
      else if (a.slice(0, 2) === "on") n.addEventListener(a.slice(2), attrs[a]);
      else if (attrs[a] !== null && attrs[a] !== false) n.setAttribute(a, attrs[a]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  var view = document.getElementById("view"), tabsEl = document.getElementById("tabs"), nav = document.querySelector("nav"), logoutBtn = document.getElementById("logout");
  document.title = project.name + " 팀 기록";
  document.getElementById("title").textContent = project.name + " 팀 기록";
  function headerLine() {
    var d = state.data || {}, t = d.today ? d.today + " (" + DAYS[new Date(d.today + "T00:00:00").getDay()] + ")" : "";
    document.getElementById("today").textContent = t + (d.me ? "  ·  " + d.me : "");
  }
  function leave(message) { state.token = null; state.data = null; local.set("token", null); renderTeamGate(message); }

  // ---------- 1. 팀 비밀번호 ----------
  function renderTeamGate(message) {
    nav.hidden = true; logoutBtn.hidden = true; view.textContent = ""; view.className = ""; headerLine();
    var input = el("input", { type: "password", id: "pass", inputmode: "numeric", autocomplete: "off", placeholder: "팀 비밀번호" });
    var msg = el("span", { class: "msg bad", role: "status", text: message || "" });
    var btn = el("button", { class: "btn", type: "submit", text: "들어가기" });
    view.appendChild(el("form", { class: "card narrow", onsubmit: function (ev) {
      ev.preventDefault(); btn.disabled = true; msg.textContent = "";
      call("login", { project: project.key, passcode: input.value, token: undefined }).then(function (d) { keep(d); route(); })
        .catch(function (e) { msg.textContent = say(e); btn.disabled = false; input.select(); });
    } }, [el("h2", { text: project.name }), el("p", { class: "sub", text: "팀 비밀번호를 넣어 주세요." }), el("label", { for: "pass", text: "팀 비밀번호" }), input, el("div", { class: "row", style: "margin-top:14px" }, [btn, msg])]));
    input.focus();
  }

  // ---------- 2. 개인 가입, 로그인 ----------
  function renderMemberGate() {
    nav.hidden = true; logoutBtn.hidden = false; view.textContent = ""; headerLine();
    var joined = state.data.members.filter(function (m) { return m.joined; });
    var mode = joined.length ? "login" : "signup";
    var box = el("div");
    var seg = el("div", { class: "seg" });
    function draw() {
      seg.textContent = ""; box.textContent = "";
      [["signup", "처음이에요"], ["login", "이미 가입했어요"]].forEach(function (m) {
        seg.appendChild(el("button", { type: "button", "aria-pressed": String(mode === m[0]), text: m[1], onclick: function () { mode = m[0]; draw(); } }));
      });
      var msg = el("span", { class: "msg bad", role: "status" });
      var pw = el("input", { type: "password", id: "mpw", autocomplete: mode === "signup" ? "new-password" : "current-password" });
      var nameInput, btn;
      if (mode === "signup") {
        nameInput = el("input", { type: "text", id: "mname", maxlength: "20", autocomplete: "name", placeholder: "실명" });
        var pw2 = el("input", { type: "password", id: "mpw2", autocomplete: "new-password" });
        btn = el("button", { class: "btn", type: "submit", text: "가입하고 들어가기" });
        box.appendChild(el("form", { onsubmit: function (ev) {
          ev.preventDefault(); msg.textContent = "";
          if (pw.value !== pw2.value) { msg.textContent = "비밀번호 두 칸이 서로 다릅니다."; return; }
          btn.disabled = true;
          call("member.signup", { name: nameInput.value, password: pw.value }).then(function (d) { keep(d); route(); }).catch(function (e) { if (expired(e)) return leave("다시 들어와 주세요."); msg.textContent = say(e); btn.disabled = false; });
        } }, [el("label", { for: "mname", text: "이름" }), nameInput, el("label", { for: "mpw", text: "개인 비밀번호" }), pw, el("label", { for: "mpw2", text: "비밀번호 한 번 더" }), pw2,
          el("p", { class: "sub", style: "margin-top:10px", text: "6자 이상. 다른 곳에서 쓰는 비밀번호는 피해 주세요. 한 번 들어오면 이 기기에서는 30일 동안 다시 묻지 않습니다." }), el("div", { class: "row" }, [btn, msg])]));
      } else {
        nameInput = el("select", { id: "mname" }, [el("option", { value: "", text: "이름 고르기" })]);
        joined.forEach(function (m) { nameInput.appendChild(el("option", { value: m.name, text: m.name })); });
        btn = el("button", { class: "btn", type: "submit", text: "들어가기" });
        box.appendChild(el("form", { onsubmit: function (ev) {
          ev.preventDefault(); msg.textContent = ""; btn.disabled = true;
          call("member.login", { name: nameInput.value, password: pw.value }).then(function (d) { keep(d); route(); }).catch(function (e) { if (expired(e)) return leave("다시 들어와 주세요."); msg.textContent = say(e); btn.disabled = false; });
        } }, [el("label", { for: "mname", text: "이름" }), nameInput, el("label", { for: "mpw", text: "개인 비밀번호" }), pw, el("div", { class: "row", style: "margin-top:14px" }, [btn, msg])]));
      }
    }
    draw();
    view.appendChild(el("div", { class: "card narrow" }, [el("h2", { text: "누구신가요" }), el("p", { class: "sub", text: "기록에 이름이 남도록 각자 가입합니다." }), seg, box]));
  }

  // ---------- 공통 조각 ----------
  function fieldsForm(fields, values, onSave) {
    var box = el("div"), inputs = {};
    fields.forEach(function (f) {
      var lab = el("label", { for: "f-" + f.key, text: f.label + (f.required ? " *" : "") });
      if (f.hint) lab.appendChild(el("small", { text: "  " + f.hint }));
      var ta = el("textarea", { id: "f-" + f.key }); ta.value = (values && values[f.key]) || ""; inputs[f.key] = ta;
      box.appendChild(lab); box.appendChild(ta);
    });
    var msg = el("span", { class: "msg", role: "status" });
    var btn = el("button", { class: "btn", type: "button", text: "저장", onclick: function () {
      var body = {}, missing = null;
      fields.forEach(function (f) { body[f.key] = inputs[f.key].value.trim(); if (f.required && !body[f.key] && !missing) missing = f; });
      msg.className = "msg bad";
      if (missing) { msg.textContent = "'" + missing.label + "'을 적어 주세요."; inputs[missing.key].focus(); return; }
      btn.disabled = true; msg.textContent = "";
      onSave(body).then(function () { msg.className = "msg"; msg.textContent = "저장했습니다."; }).catch(function (e) { if (expired(e)) return leave("다시 들어와 주세요."); msg.textContent = say(e); }).then(function () { btn.disabled = false; });
    } });
    box.appendChild(el("div", { class: "row", style: "margin-top:16px" }, [btn, msg]));
    return { node: box, fill: function (v) { fields.forEach(function (f) { inputs[f.key].value = (v && v[f.key]) || ""; }); } };
  }
  function entryNode(fields, log, meta) {
    var dl = el("dl");
    fields.forEach(function (f) { if (!log[f.key]) return; dl.appendChild(el("dt", { text: f.label })); dl.appendChild(el("dd", { text: log[f.key] })); });
    return el("div", { class: "entry" }, [el("div", {}, [el("span", { class: "who", text: log.author }), meta ? el("span", { class: "meta", text: meta }) : null]), dl]);
  }
  function soon(title, sub, lines) {
    var ul = el("ul", { class: "soon" });
    lines.forEach(function (t) { var li = el("li"); li.appendChild(el("b", { text: t[0] })); if (t[2]) li.appendChild(el("span", { class: "lock", text: t[2] })); li.appendChild(document.createTextNode(t[1] ? ": " + t[1] : "")); ul.appendChild(li); });
    return el("div", { class: "card" }, [el("h2", { text: title }), el("p", { class: "sub", text: sub }), ul]);
  }

  // ---------- 탭 ----------
  function renderToday() {
    var d = state.data;
    if (d.isMonday) view.appendChild(el("div", { class: "note", text: "오늘은 월요일입니다. '주간' 탭에서 지난주를 돌아보고 이번 주 할 일을 적어 주세요." }));
    if (d.isFirstWeek) view.appendChild(el("div", { class: "note", text: "이번 주는 이달의 첫째 주입니다. '월간' 탭의 점검 항목을 확인해 주세요." }));

  // 날짜가 바뀌면(자정이 지나면) 오늘 칸을 새로 연다. 창을 열어 둔 채 넘어가도 어제 기록을 고치지 않게.
  var kstNow = function () { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date()); };
  function checkDay() {
    var d = state.data;
    if (!d || d.needMember || !d.today || kstNow() === d.today || document.hidden) return;
    call("bootstrap").then(function (nd) { keep(nd); if (state.tab === "today" || state.tab === "calendar") render(); else { headerLine(); renderTabs(); } }).catch(function () {});
  }
  setInterval(checkDay, 60000);
  document.addEventListener("visibilitychange", checkDay);

  logoutBtn.addEventListener("click", function () { call("logout").catch(function () {}); leave(); });

  if (state.token) call("bootstrap").then(function (d) { keep(d); route(); }).catch(function (e) { e.code === "NETWORK" ? renderTeamGate(say(e)) : leave(); });
  else renderTeamGate();
})();
</script>
</body>
</html>
