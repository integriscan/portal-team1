<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>팀 기록</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1c2733;--muted:#5b6570;--line:#dfe4ea;--accent:#1f3a5f;--accent-soft:#e9eef5;--ok:#1d7a4f;--bad:#b3261e;--note:#7a5200;--note-bg:#fff6e0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  header{background:var(--accent);color:#fff;padding:18px 16px 14px}
  header .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .wrap,main{max-width:860px;margin:0 auto}
  header h1{margin:0;font-size:22px;letter-spacing:-.2px}
  header p{margin:2px 0 0;font-size:13px;opacity:.85}
  header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  nav button{border:0;background:none;padding:13px 13px;font:inherit;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
  nav button[aria-selected="true"]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
  nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d9822b;margin-left:5px;vertical-align:middle}
  main{padding:16px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
  .note{background:var(--note-bg);color:var(--note);border:1px solid #f0dfb0;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
  label small{font-weight:400;color:var(--muted)}
  textarea,input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:62px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:11px 18px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{font-size:14px;color:var(--ok)}
  .msg.bad{color:var(--bad)}
  .people{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
  .person{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:#fff}
  .person b{display:block;font-size:15px}
  .person .done{color:var(--ok)}
  .person .todo{color:var(--muted)}
  .entry{border-top:1px solid var(--line);padding:12px 0}
  .entry:first-of-type{border-top:0;padding-top:4px}
  .entry .who{font-weight:700}
  .entry .meta{color:var(--muted);font-size:13px;margin-left:6px}
  .entry dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
  .entry dt{color:var(--muted);white-space:nowrap}
  .entry dd{margin:0;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--muted);font-size:15px;padding:6px 0}
  .soon li{margin:5px 0}
  .soon b{font-weight:700}
  iframe.cal{width:100%;height:600px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .login{max-width:380px;margin:8vh auto 0}
  @media (max-width:520px){.entry dl{grid-template-columns:1fr}.entry dt{margin-top:6px}}
</style>
</head>
<body>
<header><div class="wrap"><div><h1 id="title">팀 기록</h1><p id="today"></p></div><button id="logout" type="button" hidden>나가기</button></div></header>
<nav hidden><div class="wrap" id="tabs" role="tablist"></div></nav>
<main id="view"></main>
<script>
(function () {
  "use strict";
  var API = "https://hcsoctvuzjwgvxfcrwtb.supabase.co/functions/v1/portal";
  // 주소로 프로젝트를 고른다. 미리보기에서는 ?p=team1 로 바꿔 볼 수 있다.
  // admin은 분석 화면을 여는 사람을 부르는 말. 학교 프로젝트에서는 "대표"라고 하지 않는다.
  var PROJECTS = { "orderless.feeler.kr": { key: "orderless", name: "오더리스", admin: "대표" }, "team1.feeler.kr": { key: "team1", name: "남뀨", admin: "관리자" } };
  var qp = new URLSearchParams(location.search).get("p");
  var project = PROJECTS[location.hostname] || (qp === "team1" ? PROJECTS["team1.feeler.kr"] : PROJECTS["orderless.feeler.kr"]);

  var DAILY = [
    { key: "did", label: "오늘 한 일", required: true },
    { key: "why", label: "목적", hint: "왜 했는지" },
    { key: "good", label: "잘된 것" },
    { key: "regret", label: "아쉬운 것" },
    { key: "next", label: "내일 할 일", required: true }
  ];
  var WEEKLY = [
    { key: "did", label: "이번 주 한 일", required: true },
    { key: "good", label: "잘된 것" },
    { key: "regret", label: "아쉬운 것" },
    { key: "next", label: "다음 주 할 일" }
  ];
  var ERRORS = {
    WRONG_PASSCODE: "비밀번호가 맞지 않습니다.", WRONG_PASSWORD: "비밀번호가 맞지 않습니다.", WRONG_SITE: "이 주소에서는 들어갈 수 없는 프로젝트입니다.",
    LOCKED: "여러 번 틀려서 잠겼습니다. 15분 뒤에 다시 해 주세요.", NO_SESSION: "다시 들어와 주세요.", REQUIRED: "필수 칸을 적어 주세요.",
    UNKNOWN_MEMBER: "이름을 골라 주세요.", TOO_SHORT: "8자 이상으로 정해 주세요.", ALREADY_SET: "이미 정해져 있습니다.", NETWORK: "연결하지 못했습니다. 잠시 뒤에 다시 해 주세요."
  };
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  var local = {
    get: function (k) { try { return localStorage.getItem("teamlog:" + project.key + ":" + k); } catch (e) { return null; } },
    set: function (k, v) { try { v === null ? localStorage.removeItem("teamlog:" + project.key + ":" + k) : localStorage.setItem("teamlog:" + project.key + ":" + k, v); } catch (e) {} }
  };
  var state = { token: local.get("token"), data: null, tab: "today" };

  function call(action, body) {
    var payload = Object.assign({ action: action, token: state.token }, body || {});
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw { code: j.error || "SERVER" }; return j; }); }, function () { throw { code: "NETWORK" }; });
  }
  function say(e) { return ERRORS[e && e.code] || "문제가 생겼습니다. 다시 해 주세요."; }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (a) {
      if (a === "text") n.textContent = attrs[a];
      else if (a.slice(0, 2) === "on") n.addEventListener(a.slice(2), attrs[a]);
      else if (attrs[a] !== null && attrs[a] !== false) n.setAttribute(a, attrs[a]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  var view = document.getElementById("view"), tabsEl = document.getElementById("tabs"), nav = document.querySelector("nav"), logoutBtn = document.getElementById("logout");
  document.title = project.name + " 팀 기록";
  document.getElementById("title").textContent = project.name + " 팀 기록";

  function setHeaderDate() {
    var d = state.data ? state.data.today : "";
    document.getElementById("today").textContent = d ? d + " (" + DAYS[new Date(d + "T00:00:00").getDay()] + ")" : "";
  }

  // ---------- 들어가기 ----------
  function renderLogin(message) {
    nav.hidden = true; logoutBtn.hidden = true; view.textContent = "";
    var input = el("input", { type: "password", id: "pass", inputmode: "numeric", autocomplete: "current-password", placeholder: "팀 비밀번호" });
    var msg = el("span", { class: "msg bad", role: "status", text: message || "" });
    var btn = el("button", { class: "btn", type: "submit", text: "들어가기" });
    var form = el("form", { class: "card login", onsubmit: function (ev) {
      ev.preventDefault(); btn.disabled = true; msg.textContent = "";
      call("login", { project: project.key, passcode: input.value, token: undefined }).then(function (d) {
        state.token = d.token; local.set("token", d.token); state.data = d; renderApp();
      }).catch(function (e) { msg.textContent = say(e); btn.disabled = false; input.select(); });
    } }, [el("h2", { text: project.name }), el("p", { class: "sub", text: "팀 비밀번호를 넣어 주세요. 한 번 들어오면 이 기기에서는 30일 동안 다시 묻지 않습니다." }), el("label", { for: "pass", text: "비밀번호" }), input, el("div", { class: "row", style: "margin-top:14px" }, [btn, msg])]);
    view.appendChild(form); input.focus();
  }

  // ---------- 공통 조각 ----------
  function fieldsForm(fields, values, onSave, extraTop) {
    var me = local.get("me") || "";
    var sel = el("select", { id: "author" }, [el("option", { value: "", text: "이름 고르기" })]);
    state.data.members.forEach(function (m) { var o = el("option", { value: m.name, text: m.name }); if (m.name === me) o.selected = true; sel.appendChild(o); });
    var box = el("div", {}, [extraTop, el("label", { for: "author", text: "이름" }), sel]);
    var inputs = {};
    fields.forEach(function (f) {
      var lab = el("label", { for: "f-" + f.key, text: f.label + (f.required ? " *" : "") });
      if (f.hint) lab.appendChild(el("small", { text: "  " + f.hint }));
      var ta = el("textarea", { id: "f-" + f.key }); ta.value = (values && values[f.key]) || ""; inputs[f.key] = ta;
      box.appendChild(lab); box.appendChild(ta);
    });
    function fill(v) { fields.forEach(function (f) { inputs[f.key].value = (v && v[f.key]) || ""; }); }
    sel.addEventListener("change", function () { box.dispatchEvent(new CustomEvent("author", { detail: sel.value })); });
    var msg = el("span", { class: "msg", role: "status" });
    var btn = el("button", { class: "btn", type: "button", text: "저장", onclick: function () {
      var body = { author: sel.value }, missing = null;
      fields.forEach(function (f) { body[f.key] = inputs[f.key].value.trim(); if (f.required && !body[f.key] && !missing) missing = f; });
      msg.className = "msg bad";
      if (!body.author) { msg.textContent = "이름을 골라 주세요."; sel.focus(); return; }
      if (missing) { msg.textContent = "'" + missing.label + "'을 적어 주세요."; inputs[missing.key].focus(); return; }
      btn.disabled = true; msg.textContent = "";
      local.set("me", body.author);
      onSave(body).then(function () { msg.className = "msg"; msg.textContent = "저장했습니다."; }).catch(function (e) { if (e.code === "NO_SESSION") return expire(); msg.textContent = say(e); }).then(function () { btn.disabled = false; });
    } });
    box.appendChild(el("div", { class: "row", style: "margin-top:16px" }, [btn, msg]));
    return { node: box, fill: fill, author: function () { return sel.value; } };
  }
  function entryNode(fields, log, meta) {
    var dl = el("dl");
    fields.forEach(function (f) { if (!log[f.key]) return; dl.appendChild(el("dt", { text: f.label })); dl.appendChild(el("dd", { text: log[f.key] })); });
    return el("div", { class: "entry" }, [el("div", {}, [el("span", { class: "who", text: log.author }), meta ? el("span", { class: "meta", text: meta }) : null]), dl]);
  }
  function soon(title, sub, lines) {
    var ul = el("ul", { class: "soon" });
    lines.forEach(function (t) { var li = el("li"); li.appendChild(el("b", { text: t[0] })); li.appendChild(document.createTextNode(t[1] ? ": " + t[1] : "")); ul.appendChild(li); });
    return el("div", { class: "card" }, [el("h2", { text: title }), el("p", { class: "sub", text: sub }), ul]);
  }
  function expire() { state.token = null; local.set("token", null); renderLogin("다시 들어와 주세요."); }

  // ---------- 탭 ----------
  function renderToday() {
    var d = state.data;
    if (d.isMonday) view.appendChild(el("div", { class: "note", text: "오늘은 월요일입니다. '주간' 탭에서 지난주를 돌아보고 이번 주 할 일을 적어 주세요." }));
    if (d.isFirstWeek) view.appendChild(el("div", { class: "note", text: "이번 주는 이달의 첫째 주입니다. '월간' 탭의 점검 항목을 확인해 주세요." }));

    var people = el("div", { class: "people" });
    d.members.forEach(function (m) {
      people.appendChild(el("div", { class: "person" }, [el("b", { text: m.name }), el("span", { class: m.wroteToday ? "done" : "todo", text: m.wroteToday ? "오늘 작성함" : "아직 안 씀" }), el("span", { class: "todo", text: "  ·  연속 " + m.streak + "일" })]));
    });
    view.appendChild(el("div", { class: "card" }, [el("h2", { text: "오늘 현황" }), el("p", { class: "sub", text: "연속 제출은 평일 기준입니다. 주말은 끊기지 않습니다." }), people]));

    var mineOf = function (name) { return d.todayLogs.filter(function (x) { return x.author === name; })[0]; };
    var form = fieldsForm(DAILY, mineOf(local.get("me") || ""), function (body) {
      return call("log.save", body).then(function (nd) { state.data = Object.assign(nd, { token: undefined }); render(); });
    });
    form.node.addEventListener("author", function (ev) { form.fill(mineOf(ev.detail)); });
    view.appendChild(el("div", { class: "card" }, [el("h2", { text: "오늘의 기록" }), el("p", { class: "sub", text: "하루에 한 번. 같은 날 다시 저장하면 고쳐집니다." }), form.node]));

    var feed = el("div", { class: "card" }, [el("h2", { text: "오늘 팀 기록" })]);
    if (!d.todayLogs.length) feed.appendChild(el("p", { class: "empty", text: "아직 오늘 기록이 없습니다." }));
    d.todayLogs.forEach(function (x) { feed.appendChild(entryNode(DAILY, x)); });
    view.appendChild(feed);
  }

  function renderHistory() {
    var who = "", list = el("div");
    var sel = el("select", { "aria-label": "사람 고르기", onchange: function () { who = sel.value; load(); } }, [el("option", { value: "", text: "전체" })]);
    state.data.members.forEach(function (m) { sel.appendChild(el("option", { value: m.name, text: m.name })); });
    function load() {
      list.textContent = ""; list.appendChild(el("p", { class: "empty", text: "불러오는 중입니다." }));
      call("log.history", { author: who }).then(function (r) {
        list.textContent = "";
        if (!r.logs.length) list.appendChild(el("p", { class: "empty", text: "기록이 없습니다." }));
        r.logs.forEach(function (x) { list.appendChild(entryNode(DAILY, x, x.date)); });
      }).catch(function (e) { if (e.code === "NO_SESSION") return expire(); list.textContent = ""; list.appendChild(el("p", { class: "empty", text: say(e) })); });
    }
    view.appendChild(el("div", { class: "card" }, [el("h2", { text: "지난 기록" }), el("p", { class: "sub", text: "최근 90일, 최근 날짜부터." }), sel, list]));
    load();
  }

  function renderWeekly() {
    var d = state.data, list = el("div"), mineThisWeek = {};
    var form = fieldsForm(WEEKLY, null, function (body) { return call("weekly.save", body).then(function () { return call("bootstrap"); }).then(function (nd) { state.data = nd; load(); renderTabs(); }); });
    form.node.addEventListener("author", function (ev) { form.fill(mineThisWeek[ev.detail]); });
    view.appendChild(el("div", { class: "card" }, [el("h2", { text: "주간 회고" }), el("p", { class: "sub", text: "매주 월요일. " + d.weekStart + " 주차. 지난주를 돌아보고 이번 주 할 일을 적습니다." }), form.node]));
    view.appendChild(soon("월요일에 함께 보는 것", "회의 30분", [["보드 점검", "지난주에 끝낸 카드와 이번 주에 할 카드"], ["막힌 것 풀기", "하루 기록의 '아쉬운 것'에서 반복되는 것"]]));
    view.appendChild(el("div", { class: "card" }, [el("h2", { text: "주간 회고 모음" }), list]));
    function load() {
      call("weekly.list").then(function (r) {
        list.textContent = ""; mineThisWeek = {};
        if (!r.reviews.length) list.appendChild(el("p", { class: "empty", text: "아직 주간 회고가 없습니다." }));
        r.reviews.forEach(function (x) { if (x.week_start === r.weekStart) mineThisWeek[x.author] = x; list.appendChild(entryNode(WEEKLY, x, x.week_start + " 주")); });
        form.fill(mineThisWeek[form.author()]);
      }).catch(function (e) { if (e.code === "NO_SESSION") return expire(); });
    }
    load();
  }

  function renderMonthly() {
    view.appendChild(soon("월간 점검", "매월 첫째 주에 합니다. 준비 중입니다.", [
      ["동료 평가", "팀원끼리 서로의 잘한 점과 개선점을 적습니다"], ["분기 목표 점검", "목표 3개의 진행률"], ["지출 정리", "지난달 쓴 돈과 남은 돈"], ["1:1 기록", "둘이 따로 나눈 이야기"]]));
  }
  function renderBoard() {
    view.appendChild(soon("보드", "준비 중입니다.", [["가져오기", "GitHub 보드의 변경을 받아 옵니다"], ["올리기", "여기서 만들거나 고친 카드를 GitHub로 보냅니다"]]));
  }
  function renderCalendar() {
    var url = state.data.project.calendarUrl;
    if (url) view.appendChild(el("div", { class: "card" }, [el("h2", { text: "팀 일정" }), el("iframe", { class: "cal", src: url, title: "팀 공유 캘린더", loading: "lazy" })]));
    else view.appendChild(soon("팀 일정", "공유 캘린더 주소가 아직 없습니다.", [["구글 캘린더", "팀 공유 캘린더를 만들어 주소를 넣으면 여기에 보입니다"], ["보드 마감일", "카드의 마감일도 함께 보이게 할 예정입니다"]]));
  }
  function renderMeetings() { view.appendChild(soon("회의록", "준비 중입니다.", [["Notion AI 회의록", "회의 요약, 결정, 할 일을 가져옵니다"]])); }
  function renderOps() {
    view.appendChild(soon("운영 기록", "준비 중입니다. 쓰임이 확인된 것부터 붙입니다.", [
      ["분기 목표", "목표 3개와 진행률"], ["결정 로그", "번호를 붙인 결정 기록"], ["고객·기관 접촉 기록", "누구와 언제 무슨 이야기를 했는지"], ["지출", "날짜, 항목, 금액, 영수증"]]));
  }
  function renderAnalysis() {
    var d = state.data;
    var A = project.admin;
    if (d.isAdmin) { view.appendChild(soon("분석", A + " 전용 화면입니다. 기록이 쌓이면 주 1회 보고서를 올립니다.", [["사람별", "약속 대비 완료, 마감 준수, 막힌 일, 잘한 점과 개선점"]])); return; }
    var setup = !d.project.adminSet;
    var input = el("input", { type: "password", id: "adminpw", autocomplete: setup ? "new-password" : "current-password" });
    var msg = el("span", { class: "msg bad", role: "status" });
    var btn = el("button", { class: "btn", type: "submit", text: setup ? "비밀번호 정하기" : "열기" });
    view.appendChild(el("form", { class: "card", onsubmit: function (ev) {
      ev.preventDefault(); btn.disabled = true; msg.textContent = "";
      var p = setup ? call("admin.setup", { password: input.value }).then(function () { return call("admin.login", { password: input.value }); }) : call("admin.login", { password: input.value });
      p.then(function (r) { state.token = r.token; local.set("token", r.token); return call("bootstrap"); }).then(function (nd) { state.data = nd; render(); })
        .catch(function (e) { if (e.code === "NO_SESSION") return expire(); msg.textContent = say(e); btn.disabled = false; });
    } }, [el("h2", { text: "분석" }), el("p", { class: "sub", text: setup ? A + "만 볼 수 있는 화면입니다. " + A + " 전용 비밀번호를 처음 한 번 정해 주세요(8자 이상)." : A + "만 볼 수 있습니다." }),
      el("label", { for: "adminpw", text: A + " 전용 비밀번호" }), input, el("div", { class: "row", style: "margin-top:14px" }, [btn, msg])]));
  }

  var TABS = [
    { id: "today", name: "오늘", fn: renderToday }, { id: "history", name: "지난 기록", fn: renderHistory },
    { id: "weekly", name: "주간", fn: renderWeekly, dot: function (d) { return d.isMonday; } }, { id: "monthly", name: "월간", fn: renderMonthly, dot: function (d) { return d.isFirstWeek; } },
    { id: "board", name: "보드", fn: renderBoard }, { id: "calendar", name: "일정", fn: renderCalendar }, { id: "meetings", name: "회의록", fn: renderMeetings },
    { id: "ops", name: "운영", fn: renderOps }, { id: "analysis", name: "분석", fn: renderAnalysis }
  ];
  function renderTabs() {
    tabsEl.textContent = "";
    TABS.forEach(function (t) {
      var b = el("button", { role: "tab", "aria-selected": String(t.id === state.tab), text: t.name, onclick: function () { state.tab = t.id; render(); } });
      if (t.dot && t.dot(state.data)) b.appendChild(el("span", { class: "dot", title: "이번에 할 일이 있습니다" }));
      tabsEl.appendChild(b);
    });
  }
  function render() { renderTabs(); view.textContent = ""; TABS.filter(function (t) { return t.id === state.tab; })[0].fn(); }
  function renderApp() { nav.hidden = false; logoutBtn.hidden = false; setHeaderDate(); render(); }

  logoutBtn.addEventListener("click", function () { call("logout").catch(function () {}); state.token = null; state.data = null; local.set("token", null); renderLogin(); });

  if (state.token) call("bootstrap").then(function (d) { state.data = d; renderApp(); }).catch(function (e) { e.code === "NETWORK" ? renderLogin(say(e)) : expire(); });
  else renderLogin();
})();
</script>
</body>
